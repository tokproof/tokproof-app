<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Tokproof — Exit Guide overlay</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #FF4FD8;
    --purple: #7B61FF;
    --grad: linear-gradient(135deg, #FF4FD8 0%, #7B61FF 100%);
    --grad-soft: linear-gradient(135deg, rgba(255,79,216,.22), rgba(123,97,255,.22));
    --LOOP: 6.5s;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #08060F;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }

  /* Container = phone-screen-sized canvas */
  .canvas {
    width: 360px;
    height: 740px;
    position: relative;
    border-radius: 44px;
    overflow: hidden;
    /* Hint of dimmed content underneath, no actual content */
    background:
      radial-gradient(60% 40% at 50% 18%, rgba(255,255,255,.025), transparent 70%),
      radial-gradient(80% 60% at 50% 75%, rgba(123,97,255,.05), transparent 70%),
      #06040C;
    box-shadow:
      0 60px 120px -30px rgba(0,0,0,.7),
      0 0 0 1px rgba(255,255,255,.05),
      inset 0 0 0 1px rgba(255,255,255,.03);
  }

  /* Dim layer permanently visible (since whole point is overlay) */
  .canvas::before{
    content:"";
    position: absolute; inset: 0;
    background: rgba(8,4,18,.35);
    backdrop-filter: blur(2px);
    z-index: 1;
  }

  /* Faint ghost UI behind (suggests TikTok layout dimmed) */
  .ghost {
    position: absolute; inset: 0;
    z-index: 0;
    padding: 76px 22px 0;
    opacity: .35;
  }
  .ghost .gtop {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 28px;
  }
  .ghost .gx, .ghost .gd {
    width: 18px; height: 18px; border-radius: 4px; background: rgba(255,255,255,.18);
  }
  .ghost .gt { flex: 1; height: 14px; margin: 0 12px; border-radius: 4px; background: rgba(255,255,255,.12); }
  .ghost .gav { width: 80px; height: 80px; border-radius: 50%; background: rgba(255,255,255,.10); margin: 0 auto 14px; }
  .ghost .gn { height: 14px; width: 110px; border-radius: 4px; background: rgba(255,255,255,.14); margin: 0 auto 8px; }
  .ghost .gh { height: 10px; width: 80px; border-radius: 4px; background: rgba(255,255,255,.08); margin: 0 auto 18px; }
  .ghost .grow { display: flex; gap: 8px; justify-content: center; margin-bottom: 28px; }
  .ghost .gs { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.10); }
  .ghost .gcard { height: 70px; border-radius: 12px; background: rgba(255,255,255,.06); margin-bottom: 10px; }

  /* The three dots target (top right) */
  .target {
    position: absolute; top: 24px; right: 22px;
    width: 28px; height: 28px;
    display: grid; place-items: center;
    color: #fff;
    z-index: 4;
  }
  .target .ring {
    position: absolute; inset: -8px;
    border-radius: 50%;
    box-shadow: 0 0 0 0 rgba(255,79,216,0);
    animation: ringPulse var(--LOOP) ease-in-out infinite;
  }
  @keyframes ringPulse {
    0%,30% { box-shadow: 0 0 0 0 rgba(255,79,216,0); }
    38%,62% { box-shadow: 0 0 0 5px rgba(255,79,216,.55), 0 0 22px 4px rgba(255,79,216,.45); }
    70%,100% { box-shadow: 0 0 0 0 rgba(255,79,216,0); }
  }

  /* curved arrow */
  .arrow {
    position: absolute; inset: 0;
    z-index: 5;
    pointer-events: none;
  }
  .arrow path.line {
    stroke: #fff;
    stroke-width: 2.4;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 600;
    stroke-dashoffset: 600;
    filter: drop-shadow(0 0 6px rgba(255,79,216,.55));
    animation: drawArrow var(--LOOP) cubic-bezier(.6,.05,.2,1) infinite;
  }
  /* head animation removed: arrowhead is part of the same stroke now */
  @keyframes drawArrow {
    0%,8% { stroke-dashoffset: 600; opacity: 0; }
    14% { opacity: 1; }
    62% { stroke-dashoffset: 0; opacity: 1; }
    82% { opacity: 1; }
    90%,100% { opacity: 0; stroke-dashoffset: 0; }
  }


  /* Cursor: appears and stays in place; popup attaches to it */
  .cursor {
    position: absolute;
    width: 70px; height: 70px;
    border-radius: 50%;
    background: #fff;
    display: grid; place-items: center;
    color: #0E0B17;
    box-shadow:
      0 12px 40px rgba(255,79,216,.45),
      0 0 0 8px rgba(255,255,255,.08);
    z-index: 6;
    left: calc(50% - 35px);
    top: 460px;
    opacity: 0;
    animation: cursorMove var(--LOOP) cubic-bezier(.55,.05,.25,1) infinite;
  }
  @keyframes cursorMove {
    0%,6% { opacity: 0; transform: translateY(14px) scale(.85); }
    14%,80% { opacity: 1; transform: translateY(0) scale(1); }
    88%,100% { opacity: 0; transform: translateY(-6px) scale(.95); }
  }

  /* Popup menu attached to cursor circle */
  .popup {
    position: absolute;
    top: 514px;
    left: calc(50% - 78px);
    width: 178px;
    background: rgba(28,22,42,.96);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 14px;
    box-shadow: 0 20px 50px rgba(0,0,0,.5);
    overflow: hidden;
    z-index: 6;
    transform-origin: top center;
    opacity: 0;
    transform: scale(.85) translateY(-6px);
    animation: popupShow var(--LOOP) cubic-bezier(.5,.1,.2,1) infinite;
  }
  @keyframes popupShow {
    0%,18% { opacity: 0; transform: scale(.8) translateY(-8px); }
    26%,80% { opacity: 1; transform: scale(1) translateY(0); }
    88%,100% { opacity: 0; transform: scale(.95) translateY(-4px); }
  }
  .popup::before {
    content:"";
    position: absolute; top: -6px; left: 50%; transform: translateX(-50%) rotate(45deg);
    width: 10px; height: 10px;
    background: rgba(28,22,42,.96);
    border-left: 1px solid rgba(255,255,255,.08);
    border-top: 1px solid rgba(255,255,255,.08);
  }
  .pitem {
    display: flex; align-items: center; gap: 9px;
    padding: 10px 12px;
    font-size: 12px; color: rgba(255,255,255,.78);
    font-weight: 500;
    border-bottom: 1px solid rgba(255,255,255,.05);
    position: relative;
  }
  .pitem:last-child { border-bottom: 0; }
  .pitem .pic { color: rgba(255,255,255,.5); display: flex; }
  .pitem.hl {
    color: #fff;
    background: linear-gradient(90deg, rgba(255,79,216,.22), rgba(123,97,255,.22));
  }
  .pitem.hl::before {
    content:"";
    position: absolute; left: 0; top: 0; bottom: 0; width: 2px;
    background: linear-gradient(180deg, #FF4FD8, #7B61FF);
  }
  .pitem.hl .pic { color: #fff; }
  .pitem .tap-hand {
    position: absolute;
    top: 14px; left: 28px;
    color: #fff;
    filter: drop-shadow(0 4px 12px rgba(255,79,216,.7));
    opacity: 0;
    transform-origin: 30% 0%;
    animation: tapHand 2.4s cubic-bezier(.5,.1,.2,1) infinite;
    pointer-events: none;
  }
  @keyframes tapHand {
    0%   { opacity: 0; transform: translate(28px, 36px) scale(.3); }
    18%  { opacity: 1; transform: translate(20px, 26px) scale(.55); }
    52%  { opacity: 1; transform: translate(0, 0) scale(1); }
    62%  { opacity: 1; transform: translate(-2px, -2px) scale(1.12); }   /* lift before click */
    72%  { opacity: 1; transform: translate(2px, 4px) scale(.88); }      /* click press */
    82%  { opacity: 1; transform: translate(0, 0) scale(1); }            /* settle */
    100% { opacity: 0; transform: translate(0, 0) scale(1); }
  }
  /* click ring that pulses at impact */
  .pitem .tap-hand::after {
    content: "";
    position: absolute;
    left: 8px; top: 10px;
    width: 14px; height: 14px;
    border-radius: 50%;
    border: 2px solid #fff;
    opacity: 0;
    animation: tapRing 2.4s cubic-bezier(.3,.7,.4,1) infinite;
  }
  @keyframes tapRing {
    0%,68% { opacity: 0; transform: scale(.3); }
    72%    { opacity: .9; transform: scale(.5); }
    84%    { opacity: 0; transform: scale(2.4); }
    100%   { opacity: 0; transform: scale(2.4); }
  }

  /* Caption */
  .caption {
    position: absolute;
    left: 24px; right: 24px;
    top: 620px;
    text-align: center;
    z-index: 7;
    opacity: 0;
    animation: capShow var(--LOOP) ease-out infinite;
  }
  .caption .t1 {
    font-size: 19px; font-weight: 700;
    color: #fff;
    letter-spacing: -0.02em;
  }
  .caption .t2 {
    font-size: 14px;
    color: rgba(255,255,255,.78);
    margin-top: 12px;
    line-height: 1.55;
  }
  .caption .t2 .dots {
    display: inline-flex; align-items: center; gap: 3px;
    padding: 3px 9px;
    border-radius: 999px;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.12);
    color: #fff; font-weight: 700;
    margin: 0 2px;
    vertical-align: 1px;
  }
  .caption .t2 .dots i {
    width: 3px; height: 3px; border-radius: 50%; background: #fff; display: inline-block;
  }
  .caption .t2 .pill {
    display: inline-flex; align-items: center;
    padding: 3px 10px; border-radius: 999px;
    background: var(--grad-soft);
    border: 1px solid rgba(255,79,216,.35);
    color: #fff; font-weight: 600;
    margin-top: 4px;
  }
  @keyframes capShow {
    0%,10% { opacity: 0; transform: translateY(8px); }
    18%,84% { opacity: 1; transform: translateY(0); }
    92%,100% { opacity: 0; transform: translateY(-4px); }
  }

  /* Tokproof signature pill at the very bottom */
  .sig {
    position: absolute;
    bottom: 28px; left: 50%; transform: translateX(-50%);
    display: inline-flex; align-items: center; gap: 8px;
    padding: 7px 14px 7px 9px;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.10);
    border-radius: 999px;
    font-size: 12px; color: rgba(255,255,255,.75);
    font-weight: 500;
    z-index: 8;
    backdrop-filter: blur(8px);
  }
  .sig .dot {
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--grad);
    display: grid; place-items: center;
    box-shadow: 0 0 12px rgba(255,79,216,.5);
  }

  /* subtle bg sparkle */
  .sparkles { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
  .sp {
    position: absolute;
    width: 3px; height: 3px; border-radius: 50%;
    background: #fff;
    opacity: 0;
    animation: twinkle 4s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(.5); }
    50% { opacity: .8; transform: scale(1); }
  }

  /* Optional label for dev/preview */
  .preview-label {
    position: fixed; bottom: 12px; left: 12px;
    font-size: 11px; color: rgba(255,255,255,.35);
    letter-spacing: .04em;
  }
</style>
</head>
<body>

<div class="canvas">
  <!-- faint ghost UI behind (just hints) -->
  <div class="ghost">
    <div class="gtop"><span class="gx"></span><span class="gt"></span><span class="gd"></span></div>
    <div class="gav"></div>
    <div class="gn"></div>
    <div class="gh"></div>
    <div class="grow">
      <span class="gs"></span><span class="gs"></span><span class="gs"></span>
      <span class="gs"></span><span class="gs"></span><span class="gs"></span>
    </div>
    <div class="gcard"></div>
    <div class="gcard"></div>
    <div class="gcard"></div>
  </div>

  <!-- target removed: overlay can't reach TikTok's chrome -->

  <!-- sparkles -->
  <div class="sparkles">
    <span class="sp" style="left:18%;top:30%;animation-delay:.4s"></span>
    <span class="sp" style="left:78%;top:18%;animation-delay:1.2s"></span>
    <span class="sp" style="left:82%;top:60%;animation-delay:2.1s"></span>
    <span class="sp" style="left:14%;top:72%;animation-delay:.8s"></span>
  </div>

  <!-- curved arrow ending with the arrowhead, all one continuous stroke -->
  <svg class="arrow" viewBox="0 0 360 740" preserveAspectRatio="none">
    <path class="line" d="M 195 500 C 290 450, 330 240, 325 14 l -16 22 l 16 -22 l 14 22" />
  </svg>

  <!-- floating cursor (the white circle showing ⋯) -->
  <div class="cursor">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
      <circle cx="5" cy="12" r="1.9"/>
      <circle cx="12" cy="12" r="1.9"/>
      <circle cx="19" cy="12" r="1.9"/>
    </svg>
  </div>

  <!-- popup menu attached to cursor showing the option -->
  <div class="popup">
    <div class="pitem">
      <span class="pic">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      </span>
      Copiar enlace
    </div>
    <div class="pitem hl">
      <span class="pic">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M16.24 7.76l-2.12 6.36-6.36 2.12 2.12-6.36 6.36-2.12z" fill="currentColor" fill-opacity=".2"/></svg>
      </span>
      Abrir en el navegador
      <span class="tap-hand">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11V6a2 2 0 0 1 4 0v5"/><path d="M13 9a2 2 0 0 1 4 0v3"/><path d="M17 10a2 2 0 0 1 4 0v5a7 7 0 0 1-14 0v-1l-3-3a2 2 0 0 1 3-3l2 2"/></svg>
      </span>
    </div>
  </div>

  <!-- caption -->
  <div class="caption">
    <div class="t1">Para abrir esta página</div>
    <div class="t2">
      toca los
      <span class="dots"><i></i><i></i><i></i></span>
      y elige<br/>
      <span class="pill">Abrir en el navegador</span>
    </div>
  </div>

  <!-- signature removed -->
</div>

<div class="preview-label">Overlay 360 × 740 · loop ~6.5s</div>

</body>
</html>
