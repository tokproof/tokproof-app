<style>
  :root{
    --purple:#7c3aed; --purple-500:#8b5cf6; --purple-700:#6d28d9;
    --purple-tint:#f3effe; --purple-tint-2:#ede7fd;
    --ink:#1f2430; --ink-2:#374151; --gray:#6b7280; --gray-2:#9ca3af;
    --line:#eceef2; --line-2:#e6e3ec;
    --canvas:#fbf9fc;
    --green-bg:#dcfce7; --green-tx:#16a34a;
    --pink:#e0398d;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:var(--canvas); color:var(--ink);
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    overflow:hidden;
  }
  #root{height:100vh;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;}
  input,textarea{font-family:inherit;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#dcd8e2;border-radius:8px;}
  ::-webkit-scrollbar-thumb:hover{background:#c9c4d4;}
  ::-webkit-scrollbar-track{background:transparent;}

  /* canvas block hover */
  .canvas-block{position:relative;outline:2px solid transparent;outline-offset:-2px;border-radius:4px;transition:outline-color .12s;}
  .canvas-block:hover{outline-color:#b794f6;}
  .canvas-block.selected{outline-color:#7c3aed !important;}
  .block-label{position:absolute;top:0;left:0;transform:translateY(-100%);background:var(--purple);color:#fff;font-size:11px;font-weight:700;
    padding:3px 9px;border-radius:7px 7px 0 0;opacity:0;pointer-events:none;transition:opacity .12s;white-space:nowrap;z-index:6;}
  .canvas-block:hover .block-label{opacity:1;}
  .block-tools{position:absolute;top:7px;right:7px;display:flex;gap:3px;background:#fff;border:1px solid var(--line-2);
    border-radius:10px;padding:3px;box-shadow:0 6px 16px rgba(40,20,60,.14);opacity:0;transform:translateY(-3px);
    pointer-events:none;transition:opacity .12s,transform .12s;z-index:7;}
  .canvas-block:hover .block-tools{opacity:1;transform:translateY(0);pointer-events:auto;}
  .block-tools button{width:27px;height:27px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#5b5566;}
  .block-tools button:hover{background:#f3effe;color:var(--purple);}
  .block-tools button.danger:hover{background:#fdecef;color:#e11d48;}
  .block-tools .grip{cursor:grab;}

  /* panel slide-in */
  @keyframes slideIn{from{opacity:0;transform:translateX(-14px);}to{opacity:1;transform:translateX(0);}}
  .panel-enter{animation:slideIn .18s cubic-bezier(.2,.8,.3,1) both;}

  /* editor panel slide-in from right */
  @keyframes slideInRight{from{opacity:0;transform:translateX(14px);}to{opacity:1;transform:translateX(0);}}
  .editor-panel-enter{animation:slideInRight .18s cubic-bezier(.2,.8,.3,1) both;}

  /* block added flash */
  @keyframes blockFlash{0%{outline-color:#8b5cf6;box-shadow:0 0 0 3px rgba(139,92,246,.25);}100%{outline-color:transparent;box-shadow:none;}}
  .block-added{animation:blockFlash .7s ease-out both;}

  /* popover */
  @keyframes popIn{from{opacity:0;transform:translateY(6px) scale(.98);}to{opacity:1;transform:translateY(0) scale(1);}}
  .popover{animation:popIn .16s cubic-bezier(.2,.8,.3,1) both;}
</style>
</head>

/* ---- Stars ---- */
function Stars({rating, size=12}){
  const full = Math.floor(rating);
  return (
    <div style={{display:'flex',gap:2}}>
      {[0,1,2,3,4].map(i => {
        const c = i < full ? '#f59e0b' : (i === full && (rating - full) >= 0.5) ? '#f59e0b' : '#d1d5db';
        return (
          <svg key={i} width={size} height={size} viewBox="0 0 24 24" fill={c} stroke="none">
            <path d="M12 3.2l2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L4.4 9.3l5.8-.8z"/>
          </svg>
        );
      })}
    </div>
  );
}

/* ---- FeaturedProductBlock (rendered in canvas) ---- */

  const d = {...FEATURED_PRODUCT_DEFAULTS, ...(data||{})};
  const acc = d.accentColor || '#7c3aed';
  const dark = d.theme === 'dark';
  const minimal = d.layout === 'minimal';
  const outline = d.buttonStyle === 'outline';

  const bg = dark ? '#1a1625' : '#fff';
  const textPrimary = dark ? '#fff' : '#111';
  const textSecondary = dark ? 'rgba(255,255,255,.55)' : '#6b7280';
  const textMuted = dark ? 'rgba(255,255,255,.4)' : '#9ca3af';
  const borderCol = dark ? 'rgba(255,255,255,.08)' : '#f0eef6';
  const shadow = minimal ? 'none' : dark ? '0 8px 28px rgba(0,0,0,.4)' : '0 8px 28px rgba(40,20,60,.13)';

  return (
    <div id={d.customAnchorId || undefined}
      style={{borderRadius: minimal ? 14 : 20, background: bg, border:`1px solid ${borderCol}`,
        overflow:'hidden', boxShadow: shadow,
        marginTop: d.marginTop ? `${d.marginTop}px` : 0,
        marginBottom: d.marginBottom ? `${d.marginBottom}px` : 0}}>

      {/* ── Image (card layout only) ── */}
      {!minimal && (
        <div style={{position:'relative', height:176,
          background: d.imageUrl ? 'transparent'
            : 'linear-gradient(145deg,#fce4d6 0%,#f9c5b8 40%,#f0a496 70%,#e08880 100%)',
          overflow:'hidden'}}>
          {d.imageUrl
            ? <img src={d.imageUrl} style={{width:'100%',height:'100%',objectFit:'cover'}} alt={d.productName}/>
            : <>
                <div style={{position:'absolute',inset:0,background:'linear-gradient(180deg,rgba(255,255,255,.28) 0%,transparent 55%)'}}/>
                {/* decorative bottle */}
                <div style={{position:'absolute',left:'50%',bottom:18,transform:'translateX(-50%)',width:58,height:108,
                  background:'linear-gradient(180deg,rgba(255,255,255,.58),rgba(240,150,120,.18))',
                  borderRadius:'12px 12px 16px 16px',boxShadow:'0 8px 22px rgba(150,60,40,.28)'}}>
                  <div style={{width:20,height:15,background:'rgba(120,60,40,.48)',borderRadius:3,margin:'-8px auto 0'}}/>
                </div>
              </>}
          {d.showBadge && d.badgeText && (
            <div style={{position:'absolute',top:12,left:12,
              background:'rgba(0,0,0,.72)',backdropFilter:'blur(6px)',
              color:'#fff',fontSize:11.5,fontWeight:700,padding:'5px 11px',borderRadius:20,
              letterSpacing:'-.01em'}}>
              {d.badgeText}
            </div>
          )}
        </div>
      )}

      <div style={{padding: minimal ? '13px 15px 15px' : '14px 16px 16px'}}>

        {/* badge for minimal */}
        {minimal && d.showBadge && d.badgeText && (
          <div style={{display:'inline-block',background: dark ? 'rgba(255,255,255,.1)' : 'rgba(0,0,0,.07)',
            color: textSecondary, fontSize:10.5,fontWeight:700,padding:'3px 9px',borderRadius:12,marginBottom:10}}>
            {d.badgeText}
          </div>
        )}

        {/* rating */}
        {d.showRating && (
          <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:10}}>
            <Stars rating={Number(d.rating)}/>
            <span style={{fontSize:12,fontWeight:700,color:textPrimary}}>{d.rating}</span>
            {d.showReviews && (
              <span style={{fontSize:11.5,color:textMuted}}>({d.reviewCount} reseñas)</span>
            )}
          </div>
        )}

        {/* product name */}
        <h3 style={{margin:0,fontSize:16.5,fontWeight:800,lineHeight:1.2,letterSpacing:'-.015em',
          color:textPrimary,marginBottom:6}}>{d.productName}</h3>

        {/* description */}
        <p style={{margin:'0 0 12px',fontSize:12.5,color:textSecondary,lineHeight:1.45}}>{d.description}</p>

        {/* benefits */}
        {d.showBenefits && d.benefits && d.benefits.length > 0 && (
          <div style={{display:'flex',flexDirection:'column',gap:7,marginBottom:14}}>
            {d.benefits.filter(Boolean).map((b,i)=>(
              <div key={i} style={{display:'flex',alignItems:'center',gap:8}}>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#22c55e" strokeWidth="2.5" strokeLinecap="round">
                  <path d="M5 12.5l4.5 4.5L19 6.5"/>
                </svg>
                <span style={{fontSize:12.5,fontWeight:600,color: dark ? 'rgba(255,255,255,.85)' : '#374151'}}>{b}</span>
              </div>
            ))}
          </div>
        )}

        {/* price row */}
        {d.showPrice && (
          <div style={{display:'flex',alignItems:'center',gap:9,marginBottom:14,flexWrap:'wrap'}}>
            <span style={{fontSize:22,fontWeight:800,color:textPrimary,letterSpacing:'-.02em'}}>{d.price}</span>
            {d.showCompareAtPrice && d.compareAtPrice && (
              <span style={{fontSize:14,color:textMuted,textDecoration:'line-through'}}>{d.compareAtPrice}</span>
            )}
            {d.showDiscount && d.discountText && (
              <span style={{fontSize:11.5,fontWeight:700,color:'#dc2626',background:'#fee2e2',padding:'2px 8px',borderRadius:6}}>
                {d.discountText}
              </span>
            )}
          </div>
        )}

        {/* CTA button */}
        <a href={d.buttonUrl || '#'} target={d.openInNewTab ? '_blank' : undefined}
          rel={d.openInNewTab ? 'noopener noreferrer' : undefined}
          onClick={e=>e.preventDefault()}
          style={{display:'flex',alignItems:'center',justifyContent:'center',width:'100%',
            padding:'13px',borderRadius:12,fontSize:14.5,fontWeight:700,textDecoration:'none',
            cursor:'pointer',
            ...(outline
              ? {border:`2px solid ${acc}`,color:acc,background:'transparent',boxShadow:'none'}
              : {background:`linear-gradient(180deg,${acc} 0%,${acc}bb 100%)`,color:'#fff',border:'none',
                 boxShadow:`0 8px 20px ${acc}44`}
            )
          }}>
          {d.buttonText}
        </a>

      </div>
    </div>
  );
}

/* ---- FeaturedProductEditor sub-components ---- */
function Toggle({label, checked, onChange}){
  return (
    <label style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:12,
      cursor:'pointer',padding:'6px 0',userSelect:'none'}}>
      <span style={{fontSize:13,color:'#374151',fontWeight:500,lineHeight:1.3}}>{label}</span>
      <div onClick={()=>onChange(!checked)}
        style={{width:38,height:22,borderRadius:99,background:checked?'#7c3aed':'#d1d5db',
          position:'relative',transition:'background .18s',cursor:'pointer',flexShrink:0}}>
        <div style={{position:'absolute',top:3,left:checked?18:3,width:16,height:16,
          borderRadius:99,background:'#fff',transition:'left .18s',boxShadow:'0 1px 3px rgba(0,0,0,.22)'}}/>
      </div>
    </label>
  );
}

function FField({label, children, compact}){
  return (
    <div style={{marginBottom: compact ? 10 : 14}}>
      <label style={{display:'block',fontSize:11,fontWeight:700,letterSpacing:'.05em',
        color:'#8b909a',textTransform:'uppercase',marginBottom:5}}>{label}</label>
      {children}
    </div>
  );
}

function FInput({value, onChange, type='text', placeholder='', min, max}){
  return (
    <input value={value} type={type} placeholder={placeholder} min={min} max={max}
      onChange={e=>onChange(e.target.value)}
      style={{width:'100%',border:'1px solid #e5e7eb',borderRadius:9,padding:'9px 11px',fontSize:13,
        color:'#1f2430',background:'#fafbfc',outline:'none',boxSizing:'border-box'}}
      onFocus={e=>e.target.style.borderColor='#c4b5fd'} onBlur={e=>e.target.style.borderColor='#e5e7eb'}/>
  );
}

function FTextarea({value, onChange, rows=3}){
  return (
    <textarea value={value} rows={rows} onChange={e=>onChange(e.target.value)}
      style={{width:'100%',border:'1px solid #e5e7eb',borderRadius:9,padding:'9px 11px',fontSize:13,
        color:'#1f2430',background:'#fafbfc',outline:'none',resize:'vertical',
        boxSizing:'border-box',fontFamily:'inherit',lineHeight:1.5}}
      onFocus={e=>e.target.style.borderColor='#c4b5fd'} onBlur={e=>e.target.style.borderColor='#e5e7eb'}/>
  );
}

function SegControl({options, value, onChange}){
  return (
    <div style={{display:'flex',background:'#f3f4f6',borderRadius:10,padding:3,gap:2}}>
      {options.map(([k,l])=>(
        <button key={k} onClick={()=>onChange(k)}
          style={{flex:1,fontSize:12,fontWeight:700,padding:'7px 4px',borderRadius:8,
            background:value===k?'#fff':'transparent',color:value===k?'#1f2430':'#6b7280',
            boxShadow:value===k?'0 1px 4px rgba(0,0,0,.09)':'none',transition:'all .12s',border:'none'}}>
          {l}
        </button>
      ))}
    </div>
  );
}

/* ---- FeaturedProductEditor (right panel) ---- */
function FeaturedProductEditor({data, onChange, onClose}){
  const [tab, setTab] = useState('content');
  const d = {...FEATURED_PRODUCT_DEFAULTS, ...data};

  const set = (key, val) => onChange({...d, [key]: val});

  const setBenefit = (i, val) => {
    const arr = [...d.benefits];
    arr[i] = val;
    set('benefits', arr);
  };
  const addBenefit = () => set('benefits', [...d.benefits, 'Nuevo beneficio']);
  const removeBenefit = (i) => set('benefits', d.benefits.filter((_,idx)=>idx!==i));
  const moveBenefit = (i, dir) => {
    const arr = [...d.benefits];
    const j = i + dir;
    if(j < 0 || j >= arr.length) return;
    [arr[i], arr[j]] = [arr[j], arr[i]];
    set('benefits', arr);
  };

  const TABS = [['content','Contenido'],['style','Estilo'],['advanced','Avanzado']];

  return (
    <div className="editor-panel-enter"
      style={{width:296,flexShrink:0,background:'#fff',borderLeft:'1px solid #eceef2',
        display:'flex',flexDirection:'column',overflowY:'hidden',zIndex:25}}>

      {/* Header */}
      <div style={{padding:'14px 16px 0',borderBottom:'1px solid #eceef2',flexShrink:0}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:11}}>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <span style={{fontSize:13.5,fontWeight:800,color:'#1f2430'}}>Product Showcase</span>
            <Badge tag="pro" small/>
          </div>
          <button onClick={onClose}
            style={{color:'#9aa0a8',display:'flex',padding:4,borderRadius:8,border:'none',background:'none'}}
            onMouseEnter={e=>e.currentTarget.style.background='#f2f3f5'}
            onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
            <Ic d={I.close} size={18}/>
          </button>
        </div>
        {/* tabs */}
        <SegControl options={TABS} value={tab} onChange={setTab}/>
        <div style={{height:13}}/>
      </div>

      {/* Body */}
      <div style={{flex:1,overflowY:'auto',padding:'14px 16px 24px'}}>

        {/* ── CONTENIDO ── */}
        {tab === 'content' && <>
          <FField label="URL Imagen">
            <FInput value={d.imageUrl} onChange={v=>set('imageUrl',v)} placeholder="https://cdn.tu-marca.com/producto.jpg"/>
          </FField>
          <FField label="Nombre del producto">
            <FInput value={d.productName} onChange={v=>set('productName',v)}/>
          </FField>
          <FField label="Descripción">
            <FTextarea value={d.description} onChange={v=>set('description',v)} rows={2}/>
          </FField>
          <FField label="Badge">
            <FInput value={d.badgeText} onChange={v=>set('badgeText',v)} placeholder="Ej: Más vendido 🔥"/>
          </FField>
          <div style={{display:'flex',gap:8}}>
            <div style={{flex:1}}><FField label="Rating" compact><FInput value={d.rating} onChange={v=>set('rating',v)} type="number" min="0" max="5"/></FField></div>
            <div style={{flex:1}}><FField label="Reseñas" compact><FInput value={d.reviewCount} onChange={v=>set('reviewCount',v)}/></FField></div>
          </div>
          <div style={{display:'flex',gap:8}}>
            <div style={{flex:1}}><FField label="Precio" compact><FInput value={d.price} onChange={v=>set('price',v)} placeholder="$29.99"/></FField></div>
            <div style={{flex:1}}><FField label="Precio anterior" compact><FInput value={d.compareAtPrice} onChange={v=>set('compareAtPrice',v)} placeholder="$39.99"/></FField></div>
          </div>
          <FField label="Texto descuento">
            <FInput value={d.discountText} onChange={v=>set('discountText',v)} placeholder="Ej: -25%"/>
          </FField>

          {/* benefits */}
          <FField label="Beneficios">
            <div style={{display:'flex',flexDirection:'column',gap:7}}>
              {d.benefits.map((b,i)=>(
                <div key={i} style={{display:'flex',gap:5,alignItems:'center'}}>
                  <div style={{display:'flex',flexDirection:'column',gap:2,flexShrink:0}}>
                    <button onClick={()=>moveBenefit(i,-1)} disabled={i===0}
                      style={{width:22,height:18,borderRadius:5,border:'1px solid #e5e7eb',background:'#fafbfc',
                        display:'flex',alignItems:'center',justifyContent:'center',cursor:i===0?'not-allowed':'pointer',
                        opacity:i===0?.35:1,color:'#6b7280'}}>
                      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M18 15l-6-6-6 6"/></svg>
                    </button>
                    <button onClick={()=>moveBenefit(i,1)} disabled={i===d.benefits.length-1}
                      style={{width:22,height:18,borderRadius:5,border:'1px solid #e5e7eb',background:'#fafbfc',
                        display:'flex',alignItems:'center',justifyContent:'center',cursor:i===d.benefits.length-1?'not-allowed':'pointer',
                        opacity:i===d.benefits.length-1?.35:1,color:'#6b7280'}}>
                      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M6 9l6 6 6-6"/></svg>
                    </button>
                  </div>
                  <FInput value={b} onChange={v=>setBenefit(i,v)}/>
                  <button onClick={()=>removeBenefit(i)}
                    style={{width:30,height:30,borderRadius:8,display:'flex',alignItems:'center',justifyContent:'center',
                      color:'#ef4444',background:'#fef2f2',flexShrink:0,border:'1px solid #fecaca',cursor:'pointer'}}>
                    <Ic d={I.minus} size={14} sw={2.5}/>
                  </button>
                </div>
              ))}
              <button onClick={addBenefit}
                style={{display:'flex',alignItems:'center',gap:6,fontSize:12.5,fontWeight:600,
                  color:'#7c3aed',background:'#f3effe',border:'1px dashed #c4a9f4',borderRadius:8,
                  padding:'7px 12px',cursor:'pointer',width:'100%',justifyContent:'center'}}>
                <Ic d={I.plus} size={14} sw={2.5}/> Añadir beneficio
              </button>
            </div>
          </FField>

          <FField label="Texto del botón">
            <FInput value={d.buttonText} onChange={v=>set('buttonText',v)}/>
          </FField>
          <FField label="URL del botón">
            <FInput value={d.buttonUrl} onChange={v=>set('buttonUrl',v)} placeholder="https://tutienda.com/producto"/>
          </FField>
        </>}

        {/* ── ESTILO ── */}
        {tab === 'style' && <>
          <FField label="Layout">
            <SegControl options={[['card','Card'],['minimal','Minimal']]} value={d.layout} onChange={v=>set('layout',v)}/>
          </FField>
          <FField label="Tema">
            <SegControl options={[['light','Light'],['dark','Dark']]} value={d.theme} onChange={v=>set('theme',v)}/>
          </FField>
          <FField label="Color de acento">
            <div style={{display:'flex',gap:8,alignItems:'center'}}>
              <input type="color" value={d.accentColor} onChange={e=>set('accentColor',e.target.value)}
                style={{width:40,height:36,borderRadius:8,border:'1px solid #e5e7eb',padding:2,
                  cursor:'pointer',flexShrink:0,background:'none'}}/>
              <FInput value={d.accentColor} onChange={v=>set('accentColor',v)}/>
            </div>
          </FField>
          <FField label="Estilo botón">
            <SegControl options={[['filled','Filled'],['outline','Outline']]} value={d.buttonStyle} onChange={v=>set('buttonStyle',v)}/>
          </FField>

          <div style={{borderTop:'1px solid #f0eef6',paddingTop:14,marginTop:4}}>
            <div style={{fontSize:11,fontWeight:700,color:'#9ca3af',letterSpacing:'.05em',textTransform:'uppercase',marginBottom:8}}>Visibilidad</div>
            <Toggle label="Mostrar badge" checked={d.showBadge} onChange={v=>set('showBadge',v)}/>
            <Toggle label="Mostrar rating" checked={d.showRating} onChange={v=>set('showRating',v)}/>
            <Toggle label="Mostrar nº reseñas" checked={d.showReviews} onChange={v=>set('showReviews',v)}/>
            <Toggle label="Mostrar precio" checked={d.showPrice} onChange={v=>set('showPrice',v)}/>
            <Toggle label="Mostrar precio anterior" checked={d.showCompareAtPrice} onChange={v=>set('showCompareAtPrice',v)}/>
            <Toggle label="Mostrar descuento" checked={d.showDiscount} onChange={v=>set('showDiscount',v)}/>
            <Toggle label="Mostrar beneficios" checked={d.showBenefits} onChange={v=>set('showBenefits',v)}/>
          </div>

          {/* Live preview mini */}
          <div style={{marginTop:18,borderTop:'1px solid #f0eef6',paddingTop:14}}>
            <div style={{fontSize:11,fontWeight:700,color:'#9ca3af',letterSpacing:'.05em',textTransform:'uppercase',marginBottom:10}}>Vista previa del botón</div>
            <div style={{
              display:'flex',alignItems:'center',justifyContent:'center',
              padding:'12px',borderRadius:11,fontSize:13.5,fontWeight:700,
              ...(d.buttonStyle==='outline'
                ? {border:`2px solid ${d.accentColor}`,color:d.accentColor,background:'transparent'}
                : {background:`linear-gradient(180deg,${d.accentColor},${d.accentColor}bb)`,color:'#fff',
                   boxShadow:`0 6px 16px ${d.accentColor}44`}
              )
            }}>
              {d.buttonText}
            </div>
          </div>
        </>}

        {/* ── AVANZADO ── */}
        {tab === 'advanced' && <>
          <div style={{display:'flex',gap:8}}>
            <div style={{flex:1}}>
              <FField label="Espaciado superior" compact>
                <FInput value={d.marginTop} onChange={v=>set('marginTop',parseInt(v)||0)} type="number" min="0"/>
              </FField>
            </div>
            <div style={{flex:1}}>
              <FField label="Espaciado inferior" compact>
                <FInput value={d.marginBottom} onChange={v=>set('marginBottom',parseInt(v)||0)} type="number" min="0"/>
              </FField>
            </div>
          </div>
          <FField label="ID / Ancla personalizada">
            <FInput value={d.customAnchorId} onChange={v=>set('customAnchorId',v)} placeholder="Ej: mi-producto"/>
            <div style={{fontSize:11,color:'#9ca3af',marginTop:4,lineHeight:1.4}}>
              Añade un ID para enlazar directamente a este bloque.
            </div>
          </FField>

          <div style={{borderTop:'1px solid #f0eef6',paddingTop:14,marginTop:4}}>
            <Toggle label="Abrir URL en nueva pestaña" checked={d.openInNewTab} onChange={v=>set('openInNewTab',v)}/>
            <Toggle label="Ocultar en móvil" checked={d.hideOnMobile} onChange={v=>set('hideOnMobile',v)}/>
            <Toggle label="Ocultar en escritorio" checked={d.hideOnDesktop} onChange={v=>set('hideOnDesktop',v)}/>
          </div>
        </>}

      </div>
    </div>
  );
}

            <div style={{lineHeight:1.2}}><div style={{fontSize:13.5,fontWeight:700}}>gema</div><div style={{fontSize:11.5,color:'var(--gray)'}}>Plan Pro</div></div>

          <button style={{marginTop:11,width:'100%',display:'flex',alignItems:'center',justifyContent:'center',gap:6,background:'var(--purple-tint)',color:'var(--purple-700)',fontSize:12.5,fontWeight:600,padding:'8px',borderRadius:9}}>

/* =========================== FLOATING POPOVER =========================== */
function PreviewPopover({block, top, pinned, onClose, onEnter, onLeave, onAdd, panelWidth, isUserPro}){
  if(!block) return null;
  const b=BLOCKS.find(x=>x.id===block);

  const LEFT = 212 + panelWidth + 16;
  const H = 480;
  const clampedTop = Math.max(70, Math.min(top, window.innerHeight - H - 16));
  const soon = b.tag === 'soon';
  const needsUpgrade = b.tag === 'pro' && !isUserPro;

  return (
    <div className="popover" onMouseEnter={onEnter} onMouseLeave={onLeave}
      style={{position:'fixed',left:LEFT,top:clampedTop,width:330,background:'#fff',borderRadius:18,

      <div style={{padding:'16px 16px 0'}}>

            onMouseEnter={e=>{e.currentTarget.style.background='#f2f3f5';e.currentTarget.style.color='#5b5566';}}

        </div>
      </div>
      {/* thumbnail preview — real block for featured_product */}
      <div style={{padding:'12px 16px 0'}}>
        {b.id === 'featured_product'
          ? <div style={{borderRadius:13,overflow:'hidden',border:'1px solid #efe6f8'}}>

        <div style={{fontSize:11,fontWeight:700,letterSpacing:'.05em',color:'#a4a9b2',marginTop:13}}>IDEAL PARA</div>
        <div style={{display:'flex',gap:7,flexWrap:'wrap',marginTop:8}}>
          {b.ideal.map(t=>(<span key={t} style={{fontSize:11.5,fontWeight:600,color:'var(--ink-2)',background:'#f6f4f9',border:'1px solid #ece8f2',padding:'5px 11px',borderRadius:16}}>{t}</span>))}
        </div>

        {needsUpgrade ? (

            <div style={{fontSize:12.5,color:'#6b7280',textAlign:'center',marginBottom:10,lineHeight:1.4}}>
              <strong style={{color:'#1f2430'}}>Product Showcase</strong> is available on Pro.
            </div>
            <button onClick={()=>{}}
              style={{width:'100%',display:'flex',alignItems:'center',justifyContent:'center',gap:8,
                background:'linear-gradient(180deg,#8b5cf6,#7c3aed)',color:'#fff',fontSize:14,fontWeight:700,

/* ---- block added dynamically in canvas ---- */
function AddedBlockCard({block, flash, selected, onSelect}){
  const b = BLOCKS.find(x=>x.id===block.id);
  if(!b) return null;

  /* featured_product → render the real block */
  if(block.id === 'featured_product'){
    return (
      <CanvasBlock label="Product Showcase" flash={flash} selected={selected} onSelect={onSelect}>
        <FeaturedProductBlock data={block.data}/>
      </CanvasBlock>

  }

  /* all other blocks → generic placeholder */
  return (
    <CanvasBlock label={b.name} flash={flash} selected={selected} onSelect={onSelect}>
      <div style={{borderRadius:14,overflow:'hidden',background:'linear-gradient(160deg,#faf6fe,#f5eefb)',border:'1px solid #efe6f8',padding:'10px 10px 12px'}}>

  );
}

      <div style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:9}}>
        <button style={{width:36,height:36,borderRadius:10,border:'1px solid var(--line-2)',display:'flex',alignItems:'center',justifyContent:'center',color:'#e0398d'}}
          onMouseEnter={e=>e.currentTarget.style.background='#fdf2f8'} onMouseLeave={e=>e.currentTarget.style.background='#fff'}><Ic d={I.link} size={17}/></button>
        <button style={{display:'inline-flex',alignItems:'center',gap:7,border:'1px solid var(--line-2)',color:'var(--ink-2)',fontSize:13.5,fontWeight:600,padding:'8px 14px',borderRadius:10}}
          onMouseEnter={e=>e.currentTarget.style.background='#f7f7f9'} onMouseLeave={e=>e.currentTarget.style.background='#fff'}><span style={{color:'#e0398d',display:'flex'}}><Ic d={I.copy} size={16}/></span> Copiar link</button>
        <button style={{display:'inline-flex',alignItems:'center',gap:7,border:'1px solid var(--line-2)',color:'var(--ink-2)',fontSize:13.5,fontWeight:600,padding:'8px 14px',borderRadius:10}}
          onMouseEnter={e=>e.currentTarget.style.background='#f7f7f9'} onMouseLeave={e=>e.currentTarget.style.background='#fff'}><Ic d={I.eye} size={16}/> Vista previa</button>
        <button style={{border:'1px solid var(--line-2)',color:'var(--ink-2)',fontSize:13.5,fontWeight:600,padding:'8px 18px',borderRadius:10}}
          onMouseEnter={e=>e.currentTarget.style.background='#f7f7f9'} onMouseLeave={e=>e.currentTarget.style.background='#fff'}>Guardar</button>
        <button style={{display:'inline-flex',alignItems:'center',gap:7,background:'linear-gradient(180deg,#8b5cf6,#7c3aed)',color:'#fff',fontSize:13.5,fontWeight:700,padding:'9px 20px',borderRadius:10,boxShadow:'0 6px 16px rgba(124,58,237,.35)'}}>
          <Ic d={I.spark} size={15}/> Publicar</button>
      </div>
    </header>
  );
}

/* =========================== APP =========================== */
const IS_USER_PRO = true; /* set to false to test Free gate */

function App(){
  const [isAddingBlock, setIsAddingBlock] = useState(false);
  const [pageBlocks, setPageBlocks] = useState([]);       /* [{id, data, key}] */
  const [lastAddedKey, setLastAddedKey] = useState(null);
  const [selectedBlockKey, setSelectedBlockKey] = useState(null);
  const [preview, setPreview] = useState(null);           /* {id, top, pinned} */
  const timer = useRef(null);
  const PANEL_W = 340;

  const selectedBlock = pageBlocks.find(b=>b.key===selectedBlockKey) || null;

  const scheduleClose = () => {
    clearTimeout(timer.current);
    timer.current = setTimeout(() => setPreview(p => (p && p.pinned) ? p : null), 140);
  };

  const showHover = (id, el) => {
    clearTimeout(timer.current);
    const r = el.getBoundingClientRect();
    setPreview(p => (p && p.pinned && p.id === id) ? p : {id, top: r.top, pinned: false});
  };
  const leaveHover = () => scheduleClose();
  const enterPopover = () => clearTimeout(timer.current);
  const leavePopover = () => scheduleClose();
  const onPin = (id, el) => {
    clearTimeout(timer.current);
    const r = el.getBoundingClientRect();
    setPreview({id, top: r.top, pinned: true});
  };
  const closePopover = () => { clearTimeout(timer.current); setPreview(null); };

  const openBlockPanel = () => {
    setSelectedBlockKey(null); /* close editor when opening catalog */
    setIsAddingBlock(true);
  };
  const closeBlockPanel = () => {
    clearTimeout(timer.current);
    setIsAddingBlock(false);
    setPreview(null);
  };

  const onAddBlock = (blockId) => {
    const blockMeta = BLOCKS.find(b=>b.id===blockId);
    /* Pro gate */
    if(blockMeta?.tag === 'pro' && !IS_USER_PRO){
      alert(`${blockMeta.name} is available on Pro.\nUpgrade to Pro to use this block.`);
      return;
    }
    const key = `${blockId}-${Date.now()}`;
    const defaults = blockId === 'featured_product' ? {...FEATURED_PRODUCT_DEFAULTS} : {};
    setPageBlocks(prev => [...prev, {id: blockId, data: defaults, key}]);
    setLastAddedKey(key);
    /* auto-select featured_product so editor opens immediately */
    if(blockId === 'featured_product') setSelectedBlockKey(key);
    clearTimeout(timer.current);
    setIsAddingBlock(false);
    setPreview(null);
    setTimeout(() => setLastAddedKey(null), 800);
  };

  const updateBlockData = (key, data) => {
    setPageBlocks(prev => prev.map(b => b.key === key ? {...b, data} : b));
  };

  const handleSelectBlock = (key) => {
    if(selectedBlockKey === key){
      setSelectedBlockKey(null); /* toggle off */
    } else {
      setSelectedBlockKey(key);
      if(isAddingBlock) closeBlockPanel(); /* close catalog if open */
    }
  };

  /* close pinned popover on outside click */
  useEffect(() => {
    if (!isAddingBlock || !preview || !preview.pinned) return;
    const onDoc = (e) => {
      if (e.target.closest('.popover') || e.target.closest('[data-card]')) return;
      setPreview(null);
    };
    document.addEventListener('mousedown', onDoc);
    return () => document.removeEventListener('mousedown', onDoc);
  }, [isAddingBlock, preview]);

  /* Escape closes panel / editor */
  useEffect(() => {
    const onKey = (e) => {
      if (e.key === 'Escape') {
        if(isAddingBlock) closeBlockPanel();
        else if(selectedBlockKey) setSelectedBlockKey(null);
      }
    };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [isAddingBlock, selectedBlockKey]);

  const showEditor = selectedBlock && selectedBlock.id === 'featured_product';

  return (
    <div style={{display:'flex', height:'100vh',
      minWidth: isAddingBlock ? (showEditor ? 1520 : 1220) : (showEditor ? 1160 : 860)}}>

      <Sidebar onOpenBlocks={openBlockPanel}/>

      {/* block catalog panel */}
      {isAddingBlock && (
        <BlocksPanel
          onHover={showHover}
          onLeave={leaveHover}
          onPin={onPin}
          activeId={preview && preview.id}
          onClose={closeBlockPanel}
          isUserPro={IS_USER_PRO}
        />
      )}

      <div style={{flex:1, display:'flex', flexDirection:'column', minWidth:0}}>
        <TopBar onOpenBlocks={openBlockPanel}/>
        <Canvas
          onOpenBlockPanel={openBlockPanel}
          pageBlocks={pageBlocks}
          lastAddedKey={lastAddedKey}
          selectedBlockKey={selectedBlockKey}
          onSelectBlock={handleSelectBlock}
        />
      </div>

      {/* floating popover preview */}
      {isAddingBlock && preview && (
        <PreviewPopover
          block={preview.id}
          top={preview.top}
          pinned={preview.pinned}
          onClose={closePopover}
          onEnter={enterPopover}
          onLeave={leavePopover}
          onAdd={onAddBlock}
          panelWidth={PANEL_W}
          isUserPro={IS_USER_PRO}
        />
      )}

      {/* featured_product editor panel (right side) */}
      {showEditor && (
        <FeaturedProductEditor
          data={selectedBlock.data}
          onChange={data => updateBlockData(selectedBlock.key, data)}
          onClose={() => setSelectedBlockKey(null)}
        />
      )}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
