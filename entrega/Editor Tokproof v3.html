<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tokproof — Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  :root{
    --purple:#7c3aed; --purple-500:#8b5cf6; --purple-700:#6d28d9;
    --purple-tint:#f3effe; --purple-tint-2:#ede7fd;
    --ink:#1f2430; --ink-2:#374151; --gray:#6b7280; --gray-2:#9ca3af;
    --line:#eceef2; --line-2:#e6e3ec;
    --canvas:#fbf9fc;
    --green-bg:#dcfce7; --green-tx:#16a34a;
    --pink:#e0398d;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:var(--canvas); color:var(--ink);
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    overflow:hidden;
  }
  #root{height:100vh;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;}
  input{font-family:inherit;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#dcd8e2;border-radius:8px;}
  ::-webkit-scrollbar-thumb:hover{background:#c9c4d4;}
  ::-webkit-scrollbar-track{background:transparent;}

  /* canvas block hover */
  .canvas-block{position:relative;outline:2px solid transparent;outline-offset:-2px;border-radius:4px;transition:outline-color .12s;}
  .canvas-block:hover{outline-color:#b794f6;}
  .block-label{position:absolute;top:0;left:0;transform:translateY(-100%);background:var(--purple);color:#fff;font-size:11px;font-weight:700;
    padding:3px 9px;border-radius:7px 7px 0 0;opacity:0;pointer-events:none;transition:opacity .12s;white-space:nowrap;z-index:6;}
  .canvas-block:hover .block-label{opacity:1;}
  .block-tools{position:absolute;top:7px;right:7px;display:flex;gap:3px;background:#fff;border:1px solid var(--line-2);
    border-radius:10px;padding:3px;box-shadow:0 6px 16px rgba(40,20,60,.14);opacity:0;transform:translateY(-3px);
    pointer-events:none;transition:opacity .12s,transform .12s;z-index:7;}
  .canvas-block:hover .block-tools{opacity:1;transform:translateY(0);pointer-events:auto;}
  .block-tools button{width:27px;height:27px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#5b5566;}
  .block-tools button:hover{background:#f3effe;color:var(--purple);}
  .block-tools button.danger:hover{background:#fdecef;color:#e11d48;}
  .block-tools .grip{cursor:grab;}

  /* popover */
  @keyframes popIn{from{opacity:0;transform:translateY(6px) scale(.98);}to{opacity:1;transform:translateY(0) scale(1);}}
  .popover{animation:popIn .16s cubic-bezier(.2,.8,.3,1) both;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useRef, useEffect } = React;

const Ic = ({d, size=18, sw=1.8, fill="none", style}) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor"
       strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round" style={style}>{d}</svg>
);
const I = {
  grid:<><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></>,
  cart:<><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2 3h2.2l2 12.5a1.6 1.6 0 0 0 1.6 1.3h9.3a1.6 1.6 0 0 0 1.6-1.2L20.5 7H5.2"/></>,
  user:<><circle cx="12" cy="8" r="3.6"/><path d="M5 20c1.2-3.4 4-5 7-5s5.8 1.6 7 5"/></>,
  bars:<><path d="M4 20V10M10 20V4M16 20v-7M22 20v-3" strokeWidth="2"/></>,
  squares:<><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></>,
  pen:<><path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17v3Z"/><path d="M14.5 6.5l3 3"/></>,
  pages:<><path d="M7 3h7l5 5v13H7z" /><path d="M14 3v5h5"/></>,
  bookmark:<><path d="M6 3h12v18l-6-4-6 4z"/></>,
  card:<><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 9.5h19"/></>,
  gear:<><circle cx="12" cy="12" r="3"/><path d="M12 2.5v2.5M12 19v2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M2.5 12H5M19 12h2.5M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></>,
  help:<><circle cx="12" cy="12" r="9"/><path d="M9.5 9.2a2.6 2.6 0 0 1 5 .8c0 1.7-2.5 2-2.5 3.5"/><path d="M12 17.2h.01"/></>,
  search:<><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.2-3.2"/></>,
  close:<><path d="M6 6l12 12M18 6L6 18"/></>,
  eye:<><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="2.6"/></>,
  eyeOff:<><path d="M3 3l18 18M10.6 10.7a2.6 2.6 0 0 0 3.6 3.6M9.4 5.3A9.6 9.6 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3 3.8M6 6.5A17 17 0 0 0 2 12s3.6 6.5 10 6.5a9.7 9.7 0 0 0 2.4-.3"/></>,
  copy:<><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></>,
  trash:<><path d="M4 7h16M9 7V5a1.5 1.5 0 0 1 1.5-1.5h3A1.5 1.5 0 0 1 15 5v2M6 7l1 12.5A1.5 1.5 0 0 0 8.5 21h7a1.5 1.5 0 0 0 1.5-1.5L18 7"/></>,
  grip:<><circle cx="9" cy="6" r="1.3" fill="currentColor" stroke="none"/><circle cx="15" cy="6" r="1.3" fill="currentColor" stroke="none"/><circle cx="9" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="15" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="9" cy="18" r="1.3" fill="currentColor" stroke="none"/><circle cx="15" cy="18" r="1.3" fill="currentColor" stroke="none"/></>,
  plus:<><path d="M12 5v14M5 12h14" strokeWidth="2"/></>,
  star:<><path d="M12 3.2l2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L4.4 9.3l5.8-.8z"/></>,
  clock:<><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/></>,
  check:<><path d="M5 12.5l4.5 4.5L19 6.5" strokeWidth="2.2"/></>,
  link:<><path d="M9.5 14.5l5-5M8 11l-1.6 1.6a3.5 3.5 0 0 0 5 5L13 16M11 13l1.6-1.6a3.5 3.5 0 0 0-5-5L6 8"/></>,
  monitor:<><rect x="2.5" y="4" width="19" height="12.5" rx="2"/><path d="M8.5 20.5h7M12 16.5v4"/></>,
  undo:<><path d="M9 7L4.5 11.5 9 16"/><path d="M4.5 11.5H14a5.5 5.5 0 0 1 0 11h-2"/></>,
  redo:<><path d="M15 7l4.5 4.5L15 16"/><path d="M19.5 11.5H10a5.5 5.5 0 0 0 0 11h2"/></>,
  chevDown:<><path d="M6 9l6 6 6-6"/></>,
  chevRight:<><path d="M9 6l6 6-6 6"/></>,
  lock:<><rect x="4.5" y="10.5" width="15" height="10" rx="2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></>,
  leaf:<><path d="M4 20s.5-8 8-12c5-2.5 8-2 8-2s.5 3-2 8c-4 8-12 8-12 8z"/><path d="M4 20c4-6 8-9 12-11"/></>,
  spark:<><path d="M12 3v4M12 17v4M5 12H1M23 12h-4M6.3 6.3l2 2M17.7 17.7l-2-2M6.3 17.7l2-2M17.7 6.3l-2 2"/></>,
  minus:<><path d="M5 12h14" strokeWidth="2"/></>,
  play:<><path d="M7 4.5v15l13-7.5z" fill="currentColor" stroke="none"/></>,
};

/* ---------- block thumbnails (small, for list) ---------- */
const Thumb = ({type, big}) => {
  const w = big? '100%' : 58, h = big? 150 : 86;
  const base={width:w,height:h,borderRadius:big?12:9,overflow:'hidden',flexShrink:0,
    border:'1px solid var(--line-2)',position:'relative',background:'#fff'};
  const s = big? 1.7 : 1;
  if(type==='discount') return (
    <div style={{...base,background:'linear-gradient(160deg,#fbd5e8,#f6d4f9)',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:4*s}}>
      <div style={{fontSize:13*s,fontWeight:800,color:'#111'}}>20% OFF</div>
      <div style={{fontSize:5*s,fontWeight:700,color:'#444'}}>EN TODA LA TIENDA</div>
      <div style={{background:'#1a1a1a',color:'#fff',fontSize:6*s,fontWeight:700,padding:`${3*s}px ${7*s}px`,borderRadius:4,marginTop:3}}>TOKPROOF20</div>
    </div>);
  if(type==='collections') return (
    <div style={{...base,padding:6*s,display:'flex',flexDirection:'column',gap:4*s}}>
      <div style={{fontSize:5*s,fontWeight:700,color:'#555'}}>Mis colecciones</div>
      <div style={{display:'flex',gap:4*s}}>{['#f0b5a0','#a9b8e0','#e6b3cf'].map((c,i)=><div key={i} style={{flex:1,height:24*s,borderRadius:4,background:c}}/>)}</div>
      <div style={{display:'flex',gap:4*s}}>{[0,1,2].map(i=><div key={i} style={{flex:1,height:6*s,borderRadius:2,background:'#cdd3da'}}/>)}</div>
    </div>);
  if(type==='product') return (
    <div style={{...base,padding:6*s,display:'flex',flexDirection:'column',gap:5*s}}>
      <div style={{height:40*s,borderRadius:6,background:'radial-gradient(circle at 50% 40%,#f7a98a,#e98a66)'}}/>
      <div style={{height:6*s,width:'70%',borderRadius:2,background:'#d4d7dd'}}/>
      <div style={{height:11*s,borderRadius:3,background:'#1f1f1f',marginTop:'auto'}}/>
    </div>);
  if(type==='youtube') return (
    <div style={{...base,background:'#171717',display:'flex',alignItems:'center',justifyContent:'center'}}>
      <div style={{width:26*s,height:18*s,background:'#ff0033',borderRadius:5,display:'flex',alignItems:'center',justifyContent:'center'}}>
        <div style={{width:0,height:0,borderTop:`${4*s}px solid transparent`,borderBottom:`${4*s}px solid transparent`,borderLeft:`${6*s}px solid #fff`,marginLeft:1}}/></div>
    </div>);
  if(type==='contact') return (
    <div style={{...base,padding:7*s,display:'flex',flexDirection:'column',gap:6*s}}>
      <div style={{fontSize:5*s,fontWeight:700,color:'#444'}}>Contact Form</div>
      <div style={{height:9*s,borderRadius:3,border:'1px solid #dfe2e7'}}/>
      <div style={{height:9*s,borderRadius:3,border:'1px solid #dfe2e7'}}/>
      <div style={{height:10*s,borderRadius:3,background:'#bdbfc4',marginTop:'auto'}}/>
    </div>);
  if(type==='search') return (
    <div style={{...base,padding:7*s,display:'flex',flexDirection:'column',gap:6*s}}>
      <div style={{height:10*s,borderRadius:6,border:'1px solid #dfe2e7',display:'flex',alignItems:'center',paddingLeft:5}}>
        <div style={{width:5*s,height:5*s,borderRadius:9,border:'1px solid #b5b8bd'}}/></div>
      <div style={{display:'flex',gap:4*s}}>{[0,1].map(i=><div key={i} style={{flex:1,height:20*s,borderRadius:4,background:'#e6e8ec'}}/>)}</div>
    </div>);
  if(type==='testimonials') return (
    <div style={{...base,display:'flex',gap:5*s,alignItems:'center',justifyContent:'center'}}>
      {['#c9cdd4','#bcc1c9','#c9cdd4'].map((c,i)=>(
        <div key={i} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:3*s}}>
          <div style={{width:14*s,height:14*s,borderRadius:9,background:c}}/>
          <div style={{width:15*s,height:3*s,borderRadius:2,background:'#dfe2e7'}}/></div>))}
    </div>);
  return <div style={base}/>;
};

const BLOCKS = [
  {id:'partner', name:'Partner Discounts', tag:'pro', thumb:'discount', desc:'Muestra códigos de descuento copiables.',
   long:'Muestra códigos de descuento atractivos para aumentar tus conversiones.', ideal:['E-commerce','Afiliados','Marcas','Creadores']},
  {id:'collections', name:'Creator Collections', tag:'pro', thumb:'collections', desc:'Organiza tus productos en colecciones.',
   long:'Agrupa tus productos favoritos en colecciones curadas y navegables.', ideal:['Creadores','Marcas','Tiendas']},
  {id:'product', name:'Featured Product', tag:'free', thumb:'product', desc:'Destaca un producto con imagen, precio y CTA.',
   long:'Resalta un producto estrella con foto, precio, beneficios y botón de compra.', ideal:['E-commerce','Afiliados','Dropshipping']},
  {id:'youtube', name:'YouTube Featured', tag:'pro', thumb:'youtube', desc:'Muestra tu video principal de YouTube.',
   long:'Incrusta tu mejor video de YouTube para generar confianza al instante.', ideal:['Creadores','Educadores','Marcas']},
  {id:'contact', name:'Contact Form', tag:'free', thumb:'contact', desc:'Formulario para que te contacten fácilmente.',
   long:'Un formulario simple y elegante para recibir mensajes de tu audiencia.', ideal:['Servicios','Freelancers','Marcas']},
  {id:'search', name:'Search Bar', tag:'pro', thumb:'search', desc:'Permite buscar productos en tu página.',
   long:'Buscador rápido para que tus visitantes encuentren productos al momento.', ideal:['E-commerce','Catálogos','Tiendas']},
  {id:'testimonials', name:'TESTIMONIALS', tag:'soon', thumb:'testimonials', desc:'Muestra opiniones de clientes.',
   long:'Carrusel de reseñas reales para reforzar la prueba social de tu marca.', ideal:['E-commerce','Servicios','Marcas']},
];
const TAG = {
  pro:{label:'Pro', bg:'#ede7fd', tx:'#7c3aed', lock:true},
  free:{label:'Free', bg:'#dcfce7', tx:'#16a34a'},
  soon:{label:'Próximamente', bg:'#eef0f3', tx:'#8b8f98'},
};
function Badge({tag, small}){
  const t=TAG[tag]; if(!t) return null;
  return (<span style={{display:'inline-flex',alignItems:'center',gap:4,background:t.bg,color:t.tx,
    fontSize:small?10:11,fontWeight:700,padding:small?'2px 7px':'3px 9px',borderRadius:6,whiteSpace:'nowrap'}}>
    {t.label}{t.lock && <Ic d={I.lock} size={small?10:11} sw={2}/>}</span>);
}

/* =========================== SIDEBAR =========================== */
function Sidebar(){
  const item=(icon,label,opts={})=>(
    <button style={{display:'flex',alignItems:'center',gap:12,width:'100%',padding:'9px 12px',borderRadius:10,
      color:opts.active?'var(--purple-700)':'var(--ink-2)',background:opts.active?'var(--purple-tint)':'transparent',
      fontSize:14,fontWeight:opts.active?600:500,textAlign:'left'}}
      onMouseEnter={e=>{if(!opts.active)e.currentTarget.style.background='#f5f6f8';}}
      onMouseLeave={e=>{if(!opts.active)e.currentTarget.style.background='transparent';}}>
      <span style={{color:opts.active?'var(--purple)':'#8b909a',display:'flex'}}><Ic d={icon} size={19}/></span>{label}
      {opts.badge && <span style={{marginLeft:'auto',fontSize:10,fontWeight:700,color:'var(--purple)',background:'var(--purple-tint-2)',padding:'2px 7px',borderRadius:6}}>{opts.badge}</span>}
    </button>);
  const heading=t=>(<div style={{fontSize:11,fontWeight:700,letterSpacing:'.08em',color:'#a4a9b2',padding:'0 12px',margin:'18px 0 6px'}}>{t}</div>);
  return (
    <aside style={{width:212,flexShrink:0,background:'#fff',borderRight:'1px solid var(--line)',display:'flex',flexDirection:'column',padding:'18px 12px'}}>
      <div style={{display:'flex',alignItems:'center',gap:10,padding:'2px 6px 14px'}}>
        <div style={{width:32,height:32,borderRadius:9,background:'linear-gradient(150deg,#8b5cf6,#6d28d9)',display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'0 4px 10px rgba(124,58,237,.35)'}}>
          <Ic d={<><path d="M12 2.5l7.5 4v8L12 18.5 4.5 14.5v-8z" fill="rgba(255,255,255,.25)"/><path d="M12 7l4 2.2v4.3L12 16l-4-2.5V9.2z" fill="#fff" stroke="none"/></>} size={20}/></div>
        <span style={{fontSize:18,fontWeight:800,letterSpacing:'-.02em'}}>Tokproof</span>
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:2}}>
        {item(I.grid,'Dashboard')}{item(I.cart,'E-commerce')}{item(I.user,'Marca Personal')}{item(I.bars,'Analytics')}{item(I.squares,'Templates')}
      </div>
      {heading('CREAR')}
      <div style={{display:'flex',flexDirection:'column',gap:2}}>{item(I.pen,'Editor',{active:true})}{item(I.pages,'Páginas')}{item(I.bookmark,'Bloques guardados')}</div>
      {heading('CUENTA')}
      <div style={{display:'flex',flexDirection:'column',gap:2}}>{item(I.card,'Billing',{badge:'Pro'})}{item(I.gear,'Settings')}{item(I.help,'Help')}</div>
      <div style={{marginTop:'auto',paddingTop:14}}>
        <div style={{border:'1px solid var(--line-2)',borderRadius:14,padding:12,boxShadow:'0 2px 8px rgba(20,20,40,.04)'}}>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <div style={{width:36,height:36,borderRadius:11,background:'linear-gradient(150deg,#9b6bff,#6d28d9)',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:700,fontSize:15}}>G</div>
            <div style={{lineHeight:1.2}}><div style={{fontSize:13.5,fontWeight:700}}>gema</div><div style={{fontSize:11.5,color:'var(--gray)'}}>Plan Pro</div></div>
            <span style={{marginLeft:'auto',color:'var(--purple)'}}><Ic d={I.spark} size={16}/></span>
          </div>
          <button style={{marginTop:11,width:'100%',display:'flex',alignItems:'center',justifyContent:'center',gap:6,background:'var(--purple-tint)',color:'var(--purple-700)',fontSize:12.5,fontWeight:600,padding:'8px',borderRadius:9}}>
            Ver mi perfil <Ic d={I.chevRight} size={14}/></button>
        </div>
      </div>
    </aside>
  );
}

/* =========================== BLOCKS PANEL =========================== */
function BlocksPanel({onHover, onLeave, onPin, activeId}){
  const [filter,setFilter]=useState('todos');
  const [q,setQ]=useState('');
  const filters=[['todos','Todos'],['free','Free'],['pro','Pro'],['soon','Próximamente']];
  const list=BLOCKS.filter(b=>(filter==='todos'||b.tag===filter)&&b.name.toLowerCase().includes(q.toLowerCase()));

  return (
    <section style={{width:340,flexShrink:0,background:'#fff',borderRight:'1px solid var(--line)',display:'flex',flexDirection:'column',zIndex:20}}>
      <div style={{padding:'18px 18px 0'}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <h2 style={{margin:0,fontSize:20,fontWeight:800,letterSpacing:'-.02em'}}>Bloques</h2>
          <button style={{color:'#9aa0a8',display:'flex',padding:4,borderRadius:8}}
            onMouseEnter={e=>e.currentTarget.style.background='#f2f3f5'} onMouseLeave={e=>e.currentTarget.style.background='transparent'}><Ic d={I.close} size={20}/></button>
        </div>
        <div style={{position:'relative',marginTop:14}}>
          <span style={{position:'absolute',left:13,top:'50%',transform:'translateY(-50%)',color:'#a4a9b2'}}><Ic d={I.search} size={17}/></span>
          <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Buscar bloque..."
            style={{width:'100%',border:'1px solid var(--line-2)',borderRadius:11,padding:'10px 12px 10px 38px',fontSize:13.5,outline:'none',background:'#fafbfc'}}
            onFocus={e=>e.target.style.borderColor='#cbb8f5'} onBlur={e=>e.target.style.borderColor='var(--line-2)'}/>
        </div>
        <div style={{display:'flex',gap:8,marginTop:13,flexWrap:'wrap'}}>
          {filters.map(([k,lbl])=>(
            <button key={k} onClick={()=>setFilter(k)} style={{display:'inline-flex',alignItems:'center',gap:4,fontSize:12.5,fontWeight:600,padding:'5px 13px',borderRadius:20,
              background:filter===k?'var(--purple)':'#f3f4f6',color:filter===k?'#fff':'var(--ink-2)',transition:'all .12s'}}>
              {lbl}{k==='pro' && <Ic d={I.lock} size={11} sw={2} style={{opacity:.85}}/>}</button>))}
        </div>
      </div>
      <div style={{padding:'4px 18px 0',marginTop:14,fontSize:11,fontWeight:700,letterSpacing:'.07em',color:'#a4a9b2'}}>POPULARES</div>
      <div style={{flex:1,overflowY:'auto',padding:'10px 14px 8px'}}>

/* =========================== APP =========================== */
function App(){
  const [preview,setPreview]=useState(null); // {id, top, pinned}
  const timer=useRef(null);
  const scheduleClose=()=>{
    clearTimeout(timer.current);
    timer.current=setTimeout(()=>setPreview(p=>(p && p.pinned)?p:null),140);
  };
  const showHover=(id, el)=>{
    clearTimeout(timer.current);
    const r=el.getBoundingClientRect();
    setPreview(p=> (p && p.pinned && p.id===id) ? p : {id, top:r.top, pinned:false});
  };
  const leaveHover=()=>scheduleClose();
  const enterPopover=()=>clearTimeout(timer.current);
  const leavePopover=()=>scheduleClose();
  const onPin=(id, el)=>{ clearTimeout(timer.current); const r=el.getBoundingClientRect(); setPreview({id, top:r.top, pinned:true}); };
  const closePopover=()=>{ clearTimeout(timer.current); setPreview(null); };

  // click fuera cierra el popover fijado
  useEffect(()=>{
    if(!preview || !preview.pinned) return;
    const onDoc=(e)=>{ if(e.target.closest('.popover')||e.target.closest('[data-card]')) return; setPreview(null); };
    document.addEventListener('mousedown', onDoc);
    return ()=>document.removeEventListener('mousedown', onDoc);
  },[preview]);

  return (
    <div style={{display:'flex',height:'100vh',minWidth:1220}}>
      <Sidebar/>
      <BlocksPanel onHover={showHover} onLeave={leaveHover} onPin={onPin} activeId={preview && preview.id}/>
      <div style={{flex:1,display:'flex',flexDirection:'column',minWidth:0}}>
        <TopBar/>
        <Canvas/>
      </div>
      {preview && <PreviewPopover block={preview.id} top={preview.top} pinned={preview.pinned}
        onClose={closePopover} onEnter={enterPopover} onLeave={leavePopover}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
